name: LARPLocation
options:
  bundleIdPrefix: com.edui
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LARPLocation:
    type: application
    platform: iOS
    sources:
      - LARPLocation
    info:
      path: LARPLocation/Info.plist
      properties:
        CFBundleDisplayName: LARP Location
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "LARP Location shows your real position on the map so you can compare it with your pretend one."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edui.larplocation
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
